plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    implementation 'org.apache.derby:derby:10.15.2.0'
    implementation 'org.apache.derby:derbyshared:10.15.2.0'
    implementation 'org.eclipse.persistence:eclipselink:4.0.5'
    implementation 'jakarta.persistence:jakarta.persistence-api:3.0.5'
    implementation 'org.jfree:jcommon:1.0.21'
    implementation 'org.jfree:jfreechart:1.0.17'

    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.2'
    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.2'
}


tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
tasks.named('processResources').configure {
    dependsOn tasks.named('compileJava')
}
sourceSets {
    main {
        resources.setSrcDirs([java.destinationDirectory])
    }
}
tasks.withType(Jar).configureEach {
    archiveBaseName.set('badBm')
}


jar {

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE


    manifest {

        attributes(
                'Main-Class': 'edu.touro.mco152.bm.App'
        )
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}