plugins {
    // Apply the java-library plugin for API and implementation separation.
    id 'java-library'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
// Charting api/runtime
    implementation group: 'org.jfree', name: 'jfreechart', version: '1.0.17'
// persistence API
    implementation group: 'jakarta.persistence', name: 'jakarta.persistence-api', version: '3.0.0'
    implementation group: 'org.eclipse.persistence', name: 'eclipselink', version: '4.0.2'
// DBMS
    implementation group: 'org.apache.derby', name: 'derby', version: '10.17.1.0'
    implementation group: 'org.apache.derby', name: 'derbyshared', version: '10.15.2.0'
}


tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
}
sourceSets {
    main {
        output.resourcesDir = java.destinationDirectory.get().asFile
    }
}
archivesBaseName = 'badBm'


jar {

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE


    manifest {

        attributes(
                'Main-Class': 'edu.touro.mco152.bm.App'
        )
    }

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
}